<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Récords del Club | Mejores Marcas · Club Atletismo Apolana</title>
  <meta name="description" content="Récords y mejores marcas históricas del Club Atletismo Apolana de Alicante por prueba y categoría.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://escuelaapolana.github.io/apolana-club/records.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Récords del Club | Club Atletismo Apolana">
  <meta property="og:description" content="Las mejores marcas de la historia del club.">
  <meta property="og:image" content="https://icaxokjsvhlreuwpyxeb.supabase.co/storage/v1/object/public/imagenes-club/hero.jpg">
  <meta name="theme-color" content="#1a5f8f">
  <link rel="icon" type="image/png" href="https://icaxokjsvhlreuwpyxeb.supabase.co/storage/v1/object/public/imagenes-club/logo.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="nav.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --azul: #1a5f8f; --azul-oscuro: #123f60; --azul-claro: #4a90c4; --azul-bg: #e8f2fa;
      --gris: #f5f6f8; --gris-borde: #dde2e8; --texto: #1a1d23; --texto-suave: #6b7280;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: white; color: var(--texto); line-height: 1.6; position: relative; }
    body::before { content:''; position:fixed; top:10%; right:-240px; width:620px; height:620px; border-radius:50%; background:radial-gradient(circle, rgba(74,144,196,0.08) 0%, transparent 70%); pointer-events:none; z-index:0; }
    body::after { content:''; position:fixed; bottom:5%; left:-280px; width:680px; height:680px; border-radius:50%; background:radial-gradient(circle, rgba(26,95,143,0.06) 0%, transparent 70%); pointer-events:none; z-index:0; }
    .page-header, .wrap, .cta, footer { position: relative; z-index: 1; }
    nav { position: sticky; z-index: 500; }

    .page-header { position: relative; background: var(--azul-oscuro); padding: 3rem 2rem 2.5rem; text-align: center; overflow: hidden; }
    .page-header-bg { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: 0.22; }
    .ph-inner { position: relative; }
    .ph-breadcrumb { color: rgba(255,255,255,0.55); font-size: 0.78rem; margin-bottom: 0.75rem; }
    .ph-breadcrumb a { color: rgba(255,255,255,0.55); text-decoration: none; }
    .ph-breadcrumb a:hover { color: white; }
    .page-header h1 { color: white; font-size: 2.2rem; font-weight: 800; margin-bottom: 0.4rem; letter-spacing: -0.02em; }
    .page-header p { color: rgba(255,255,255,0.72); font-size: 0.95rem; }

    .wrap { max-width: 980px; margin: 0 auto; padding: 2.5rem 2rem 4rem; }

    /* CONTROLES */
    .controles { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.75rem; align-items: center; justify-content: space-between; }
    .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .tab { padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--gris-borde); background: white; font-size: 0.83rem; font-weight: 600; color: var(--texto-suave); cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .tab:hover { border-color: var(--azul-claro); color: var(--azul); }
    .tab.activo { background: var(--azul); border-color: var(--azul); color: white; }
    .buscador { padding: 8px 14px; border: 1.5px solid var(--gris-borde); border-radius: 9px; font-size: 0.85rem; font-family: inherit; min-width: 200px; }
    .buscador:focus { outline: none; border-color: var(--azul); }

    /* TABLA */
    .tabla-wrap { background: white; border: 1px solid var(--gris-borde); border-radius: 14px; overflow: hidden; }
    .grupo-head { background: linear-gradient(180deg,#f8fafc 0%,#f1f5f9 100%); padding: 0.75rem 1.25rem; font-size: 0.72rem; font-weight: 700; color: var(--azul); text-transform: uppercase; letter-spacing: 0.09em; border-bottom: 1px solid var(--gris-borde); }
    .record { display: grid; grid-template-columns: 1fr auto; gap: 1rem; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--gris-borde); align-items: center; transition: background 0.12s; }
    .record:last-child { border-bottom: none; }
    .record:hover { background: #fbfcfe; }
    .rec-izq { min-width: 0; }
    .rec-prueba { font-size: 0.93rem; font-weight: 700; margin-bottom: 2px; }
    .rec-atleta { font-size: 0.85rem; color: var(--azul); font-weight: 600; }
    .rec-meta { font-size: 0.76rem; color: var(--texto-suave); margin-top: 2px; }
    .rec-der { text-align: right; }
    .rec-marca { font-size: 1.25rem; font-weight: 800; color: var(--azul); line-height: 1; font-variant-numeric: tabular-nums; }
    .rec-anyo { font-size: 0.74rem; color: var(--texto-suave); margin-top: 3px; }

    .vacio { text-align: center; padding: 3.5rem 2rem; }
    .vacio-icono { font-size: 2.5rem; margin-bottom: 1rem; opacity: 0.4; }
    .vacio h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; }
    .vacio p { font-size: 0.88rem; color: var(--texto-suave); max-width: 440px; margin: 0 auto; }

    .nota { font-size: 0.8rem; color: var(--texto-suave); text-align: center; margin-top: 1.25rem; }
    .nota a { color: var(--azul); }

    .cta { background: var(--azul-oscuro); padding: 3rem 2rem; text-align: center; }
    .cta h2 { color: white; font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
    .cta p { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 1.5rem; }
    .btn-w { background: white; color: var(--azul); padding: 11px 26px; border-radius: 9px; text-decoration: none; font-weight: 700; font-size: 0.9rem; }

    footer { background: #0f172a; padding: 2rem; }
    .footer-inner { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .footer-logo { display: flex; align-items: center; gap: 10px; }
    .footer-logo img { width: 32px; height: 32px; border-radius: 50%; }
    .footer-logo span { color: white; font-size: 0.85rem; font-weight: 600; }
    .footer-links { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    .footer-links a { color: rgba(255,255,255,0.5); font-size: 0.82rem; text-decoration: none; }
    .footer-links a:hover { color: white; }

    @media (max-width: 768px) {
      .wrap { padding: 1.75rem 1.25rem 3rem; }
      .page-header h1 { font-size: 1.65rem; }
      .controles { flex-direction: column; align-items: stretch; }
      .buscador { width: 100%; }
      .rec-marca { font-size: 1.1rem; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <div class="page-header-bg" style="background-image:url('https://icaxokjsvhlreuwpyxeb.supabase.co/storage/v1/object/public/imagenes-club/hero.jpg');"></div>
  <div class="ph-inner">
    <div class="ph-breadcrumb"><a href="index.html">Club Apolana</a> / Récords</div>
    <h1>Récords del club</h1>
    <p>Las mejores marcas de nuestra historia</p>
  </div>
</div>

<div class="wrap">
  <div class="controles" id="controles" style="display:none;">
    <div class="tabs" id="tabs"></div>
    <input type="search" class="buscador" id="buscador" placeholder="Buscar prueba o atleta..." oninput="render()">
  </div>
  <div id="contenido">
    <div class="vacio"><div class="vacio-icono">⏱️</div><h3>Cargando récords...</h3></div>
  </div>
</div>

<div class="cta">
  <h2>¿Te ves capaz de batir alguno?</h2>
  <p>Entrena con nosotros y ponle tu nombre a un récord</p>
  <a href="secciones.html" class="btn-w">Ver secciones</a>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">
      <img src="https://icaxokjsvhlreuwpyxeb.supabase.co/storage/v1/object/public/imagenes-club/logo.png" alt="Club Apolana" onerror="this.style.display='none'">
      <span>Club Atletismo Apolana · Alicante</span>
    </div>
    <div class="footer-links">
      <a href="club.html">El club</a>
      <a href="palmares.html">Palmarés</a>
      <a href="records.html">Récords</a>
      <a href="contacto.html">Contacto</a>
    </div>
  </div>
</footer>

<script>
const SB_URL = 'https://icaxokjsvhlreuwpyxeb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljYXhva2pzdmhscmV1d3B5eGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNzE2NTgsImV4cCI6MjA5NjY0NzY1OH0.xn1ZY-otHY0-l7g64uutSVjiU8DbkHxxZmTvu77IaHA';
const db = supabase.createClient(SB_URL, SB_KEY);

let datos = [], catActiva = 'todas';

async function cargar() {
  const { data } = await db.from('records_club').select('*').order('categoria').order('orden').order('prueba');
  datos = data || [];
  if (!datos.length) {
    document.getElementById('contenido').innerHTML = `
      <div class="vacio">
        <div class="vacio-icono">⏱️</div>
        <h3>Los récords se están recopilando</h3>
        <p>Estamos reuniendo las mejores marcas de la historia del club por prueba y categoría. Si conoces algún registro que deba figurar aquí, <a href="contacto.html" style="color:var(--azul);">escríbenos</a>.</p>
      </div>`;
    return;
  }
  renderTabs();
  document.getElementById('controles').style.display = 'flex';
  render();
}

function renderTabs() {
  const cats = [...new Set(datos.map(d => d.categoria).filter(Boolean))];
  document.getElementById('tabs').innerHTML =
    `<button class="tab activo" onclick="setCat('todas',this)">Todas</button>` +
    cats.map(c => `<button class="tab" onclick="setCat('${c}',this)">${c}</button>`).join('');
}

function setCat(c, btn) {
  catActiva = c;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('activo'));
  btn.classList.add('activo');
  render();
}

function render() {
  const q = (document.getElementById('buscador').value || '').toLowerCase();
  let lista = catActiva === 'todas' ? datos : datos.filter(d => d.categoria === catActiva);
  if (q) lista = lista.filter(d => ((d.prueba||'') + ' ' + (d.atleta||'')).toLowerCase().includes(q));

  if (!lista.length) {
    document.getElementById('contenido').innerHTML = '<div class="vacio"><p>No hay récords que coincidan con la búsqueda.</p></div>';
    return;
  }

  const grupos = {};
  lista.forEach(d => { const k = d.categoria || 'General'; (grupos[k] = grupos[k] || []).push(d); });

  document.getElementById('contenido').innerHTML = '<div class="tabla-wrap">' +
    Object.entries(grupos).map(([cat, items]) => `
      <div class="grupo-head">${cat}</div>
      ${items.map(r => `
        <div class="record">
          <div class="rec-izq">
            <div class="rec-prueba">${r.prueba || ''}</div>
            <div class="rec-atleta">${r.atleta || '—'}</div>
            ${(r.sede || r.competicion) ? `<div class="rec-meta">${[r.competicion, r.sede].filter(Boolean).join(' · ')}</div>` : ''}
          </div>
          <div class="rec-der">
            <div class="rec-marca">${r.marca || '—'}</div>
            ${r.anyo ? `<div class="rec-anyo">${r.anyo}</div>` : ''}
          </div>
        </div>`).join('')}
    `).join('') + '</div>' +
    '<p class="nota">¿Falta algún récord o hay una marca mejor? <a href="contacto.html">Avísanos</a>.</p>';
}

cargar();
</script>

</body>
</html>
