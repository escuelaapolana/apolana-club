<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noticias · Club Apolana</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --azul: #1a5f8f; --azul-oscuro: #123f60; --azul-claro: #4a90c4; --azul-bg: #e8f2fa;
      --gris: #f5f6f8; --gris-borde: #dde2e8; --texto: #1a1d23; --texto-suave: #6b7280;
    }
    html { scroll-behavior: smooth; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gris); color: var(--texto); }
    .nav-logo img { width: 34px; height: 34px; border-radius: 50%; object-fit: contain; background: white; padding: 2px; }
    .nav-logo span { color: white; font-weight: 600; font-size: 0.95rem; }
    .page-header {
      position: relative; height: 280px; background: var(--azul-oscuro);
      display: flex; align-items: flex-end; overflow: hidden;
    }
    .page-header-bg {
      position: absolute; inset: 0; background-size: cover;
      background-position: center; opacity: 0.35;
    }
    .page-header-inner {
      position: relative; padding: 2rem 3rem; max-width: 1040px;
      width: 100%; margin: 0 auto;
    }
    .page-header-breadcrumb {
      color: rgba(255,255,255,0.6); font-size: 0.78rem; margin-bottom: 0.5rem;
    }
    .page-header-breadcrumb a { color: rgba(255,255,255,0.6); text-decoration: none; }
    .page-header-breadcrumb a:hover { color: white; }
    .page-header h1 {
      color: white; font-size: 2.4rem; font-weight: 700;
      line-height: 1.15; margin-bottom: 0.4rem;
    }
    .page-header p { color: rgba(255,255,255,0.75); font-size: 0.95rem; }
    @media (max-width: 640px) {
      .page-header { height: 200px; }
      .page-header h1 { font-size: 1.7rem; }
      .page-header-inner { padding: 1.5rem; }
    }

    .page-wrap { max-width: 1040px; margin: 0 auto; padding: 2rem; }

    /* NOTICIA DESTACADA */
    .noticia-featured { background: white; border-radius: 14px; border: 1px solid var(--gris-borde); overflow: hidden; margin-bottom: 2rem; display: grid; grid-template-columns: 1fr 1fr; }
    .noticia-featured-img { height: 300px; background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul) 100%); overflow: hidden; position: relative; }
    .noticia-featured-img img { width: 100%; height: 100%; object-fit: cover; }
    .noticia-featured-img-ph { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; color: rgba(255,255,255,0.3); }
    .noticia-featured-img-ph svg { opacity: 0.4; }
    .noticia-featured-body { padding: 2rem; display: flex; flex-direction: column; justify-content: center; }
    .noticia-tag { font-size: 0.7rem; font-weight: 600; color: var(--azul-claro); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.75rem; }
    .noticia-titulo { font-size: 1.3rem; font-weight: 700; line-height: 1.3; margin-bottom: 0.75rem; }
    .noticia-excerpt { font-size: 0.88rem; color: var(--texto-suave); line-height: 1.7; margin-bottom: 1.25rem; }
    .noticia-fecha { font-size: 0.75rem; color: var(--texto-suave); display: flex; align-items: center; gap: 6px; }

    /* GRID NOTICIAS */
    .noticias-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.25rem; }
    .noticia-card { background: white; border-radius: 12px; border: 1px solid var(--gris-borde); overflow: hidden; transition: all 0.12s; }
    .noticia-card:hover { border-color: var(--azul-claro); transform: translateY(-3px); }
    .noticia-card-img { height: 180px; background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul) 100%); overflow: hidden; }
    .noticia-card-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .noticia-card:hover .noticia-card-img img { transform: scale(1.04); }
    .noticia-card-img-ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.25); }
    .noticia-card-body { padding: 1.1rem; }
    .noticia-card-titulo { font-size: 0.92rem; font-weight: 600; margin-bottom: 0.5rem; line-height: 1.4; }
    .noticia-card-excerpt { font-size: 0.82rem; color: var(--texto-suave); line-height: 1.6; margin-bottom: 0.75rem; }
    .noticia-card-footer { display: flex; align-items: center; justify-content: space-between; }
    .noticia-card-fecha { font-size: 0.75rem; color: var(--texto-suave); }

    /* INSTAGRAM CTA */
    .ig-cta { background: white; border: 1px solid var(--gris-borde); border-radius: 12px; padding: 1.5rem; margin-top: 2rem; display: flex; align-items: center; gap: 1.25rem; }
    .ig-icon { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ig-cta-text strong { display: block; font-size: 0.92rem; margin-bottom: 2px; }
    .ig-cta-text span { font-size: 0.82rem; color: var(--texto-suave); }
    .ig-btn { margin-left: auto; background: var(--azul); color: white; padding: 8px 18px; border-radius: 8px; text-decoration: none; font-size: 0.83rem; font-weight: 500; white-space: nowrap; flex-shrink: 0; }

    .empty-state { text-align: center; padding: 3rem; color: var(--texto-suave); }

    footer { background: var(--azul-oscuro); padding: 2rem; margin-top: 3rem; }
    .footer-inner { max-width: 1040px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .footer-logo { display: flex; align-items: center; gap: 8px; }
    .footer-logo img { width: 26px; height: 26px; border-radius: 50%; background: white; padding: 2px; object-fit: contain; }
    .footer-logo span { color: white; font-weight: 600; font-size: 0.85rem; }
    .footer-links a { color: rgba(255,255,255,0.45); text-decoration: none; font-size: 0.78rem; margin-left: 1.25rem; }
    .footer-links a:hover { color: white; }

    @media (max-width: 640px) {
      .noticia-featured { grid-template-columns: 1fr; }
      .noticia-featured-img { height: 200px; }
      .page-wrap { padding: 1rem; }
      .ig-cta { flex-wrap: wrap; }
      .ig-btn { margin-left: 0; width: 100%; text-align: center; }
    }
  </style>
<script src="nav.js"></script>
<link rel="icon" type="image/png" href="https://icaxokjsvhlreuwpyxeb.supabase.co/storage/v1/object/public/imagenes-club/logo.png">
</head>
<body>



<div class="page-header">
  <div class="page-header-bg" style="background-image:url('https://icaxokjsvhlreuwpyxeb.supabase.co/storage/v1/object/public/imagenes-club/header-noticias.jpg');" onerror="this.style.opacity=0"></div>
  <div class="page-header-inner">
    <div class="page-header-breadcrumb"><a href="index.html">Club Apolana</a> / Noticias</div>
    <h1>Noticias del club</h1>
    <p>Resultados, novedades y comunicados del Club Apolana</p>
  </div>
</div>

<div class="page-wrap">
  <div id="noticias-contenido">
    <div class="empty-state">Cargando noticias...</div>
  </div>

  <!-- Instagram CTA -->
  <div class="ig-cta">
    <div class="ig-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1" fill="white" stroke="none"/></svg>
    </div>
    <div class="ig-cta-text">
      <strong>Síguenos en Instagram</strong>
      <span>Fotos, vídeos y actualizaciones diarias en @apolana.alicante</span>
    </div>
    <a href="campus.html" class="nav-link">Campus</a>
    <a href="https://instagram.com/apolana.alicante" target="_blank" class="ig-btn">Seguir en Instagram</a>
  </div>
</div>

<footer>
  <div class="footer-inner">
    <div class="footer-logo">
      <img src="https://icaxokjsvhlreuwpyxeb.supabase.co/storage/v1/object/public/imagenes-club/logo.png" alt="Logo" onerror="this.style.display='none'">
      <span>Club Apolana · Alicante</span>
    </div>
    <div class="footer-links">
      <a href="index.html">Inicio</a>
      <a href="inscripcion.html">Inscripción</a>
      <a href="calendario.html">Calendario</a>
    </div>
  </div>
</footer>

<script>
const SB_URL = 'https://icaxokjsvhlreuwpyxeb.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljYXhva2pzdmhscmV1d3B5eGViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNzE2NTgsImV4cCI6MjA5NjY0NzY1OH0.xn1ZY-otHY0-l7g64uutSVjiU8DbkHxxZmTvu77IaHA';
const db = supabase.createClient(SB_URL, SB_KEY);
const IMG = SB_URL + '/storage/v1/object/public/imagenes-club/';

// Noticias estáticas — las editas desde admin → Contenido web (próximamente tabla noticias)
// Por ahora cargamos las fotos de noticia-1, noticia-2, noticia-3 del Storage
const NOTICIAS_ESTATICAS = [
  { id: 1, tag: 'Temporada', titulo: 'Inicio de la temporada 2025/26', texto: 'Abrimos el periodo de inscripciones para la nueva temporada. Tenemos plazas disponibles en todas las secciones: escuela, running, triatlón y natación. Periodo de prueba gratuito de 15 días.', fecha: 'Junio 2025', foto: 'noticia-1.jpg' },
  { id: 2, tag: 'Competición', titulo: 'Resultados del Campeonato Provincial', texto: 'Excelentes resultados de nuestros atletas en el Campeonato Provincial de Atletismo celebrado en Alicante. Varios podios en categorías infantil y cadete.', fecha: 'Mayo 2025', foto: 'noticia-2.jpg' },
  { id: 3, tag: 'Club', titulo: 'Nuevas actividades para familias', texto: 'Este otoño lanzamos un programa de actividades pensado para padres y madres del club. Running, yoga y nutrición deportiva entre las propuestas.', fecha: 'Abril 2025', foto: 'noticia-3.jpg' },
];

async function cargarNoticias() {
  const contenedor = document.getElementById('noticias-contenido');

  // Cargar desde Supabase
  const { data: noticias } = await db.from('noticias')
    .select('*')
    .eq('publicada', true)
    .order('fecha_publicacion', { ascending: false });

  if (!noticias?.length) {
    contenedor.innerHTML = '<div class="empty-state">No hay noticias publicadas</div>';
    return;
  }

  noticiasCache = noticias;
  const fmt = f => f ? new Date(f).toLocaleDateString('es-ES', {day:'numeric',month:'long',year:'numeric'}) : '';
  const [primera, ...resto] = noticias;

  // Noticia destacada
  let featuredHtml = `
    <div class="noticia-featured" onclick="abrirNoticia('${primera.id}')" style="cursor:pointer;">
      <div class="noticia-featured-img" id="featured-img-${primera.id}">
        <div class="noticia-featured-img-ph">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
      </div>
      <div class="noticia-featured-body">
        <div class="noticia-tag">${primera.categoria||'Club'}</div>
        <div class="noticia-titulo">${primera.titulo}</div>
        <div class="noticia-excerpt">${primera.resumen||''}</div>
        <div class="noticia-fecha">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${fmt(primera.fecha_publicacion)}
        </div>
        <div style="margin-top:1rem;"><span style="color:var(--azul);font-size:0.82rem;font-weight:600;">Leer más →</span></div>
      </div>
    </div>`;

  // Grid resto
  let gridHtml = '<div class="noticias-grid">' + resto.map(n => `
    <div class="noticia-card" onclick="abrirNoticia('${n.id}')" style="cursor:pointer;">
      <div class="noticia-card-img" id="card-img-${n.id}">
        <div class="noticia-card-img-ph">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
      </div>
      <div class="noticia-card-body">
        <div class="noticia-tag">${n.categoria||'Club'}</div>
        <div class="noticia-card-titulo">${n.titulo}</div>
        <div class="noticia-card-excerpt">${n.resumen||''}</div>
        <div class="noticia-card-footer">
          <span class="noticia-card-fecha">${fmt(n.fecha_publicacion)}</span>
          <span style="color:var(--azul);font-size:0.75rem;font-weight:600;">Leer →</span>
        </div>
      </div>
    </div>`).join('') + '</div>';

  contenedor.innerHTML = featuredHtml + gridHtml;

  // Cargar fotos
  noticias.forEach(n => {
    if (!n.foto_portada) return;
    const url = IMG + n.foto_portada;
    const img = new Image();
    img.onload = () => {
      const slot = document.getElementById((n === primera ? 'featured-img-' : 'card-img-') + n.id);
      if (slot) { slot.innerHTML = `<img src="${url}" alt="${n.titulo}">`; }
    };
    img.src = url;
  });
}

let noticiasCache = [];

function abrirNoticia(id) {
  const n = noticiasCache.find(x => x.id === id);
  if (!n) return;
  const fmt = f => f ? new Date(f).toLocaleDateString('es-ES', {day:'numeric',month:'long',year:'numeric'}) : '';

  // Crear modal si no existe
  let modal = document.getElementById('modal-noticia');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'modal-noticia';
    modal.style.cssText = 'display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;overflow-y:auto;padding:2rem 1rem;';
    modal.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };
    document.body.appendChild(modal);
  }

  modal.innerHTML = `
    <div style="background:white;border-radius:16px;max-width:700px;margin:0 auto;overflow:hidden;">
      ${n.foto_portada ? `<img src="${IMG}${n.foto_portada}" style="width:100%;height:280px;object-fit:cover;">` :
        `<div style="height:200px;background:linear-gradient(135deg,var(--azul-oscuro),var(--azul));"></div>`}
      <div style="padding:2rem;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
          <span style="background:var(--azul-bg);color:var(--azul);font-size:0.72rem;font-weight:700;padding:3px 10px;border-radius:20px;text-transform:uppercase;">${n.categoria||'Club'}</span>
          <button onclick="document.getElementById('modal-noticia').style.display='none'" style="background:none;border:none;cursor:pointer;color:var(--texto-suave);font-size:1.3rem;line-height:1;">✕</button>
        </div>
        <h2 style="font-size:1.4rem;font-weight:800;margin-bottom:0.5rem;line-height:1.3;">${n.titulo}</h2>
        <div style="font-size:0.78rem;color:var(--texto-suave);margin-bottom:1.5rem;">${fmt(n.fecha_publicacion)}</div>
        ${n.resumen ? `<p style="font-size:0.95rem;color:var(--texto-suave);margin-bottom:1.25rem;line-height:1.7;font-style:italic;">${n.resumen}</p>` : ''}
        <div style="font-size:0.92rem;line-height:1.8;color:var(--texto);">${(n.contenido||'').replace(/\n/g,'<br>')}</div>
      </div>
    </div>`;

  modal.style.display = 'block';
}

cargarNoticias();


</script>
</body>
</html>
